<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>gaze-lite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app" id="app">
      <div class="brandmark"><span class="dot"></span><span>gaze · lite</span></div>

      <!-- Full-viewport heatmap (the only full-screen canvas) -->
      <canvas class="heatmap-canvas" id="heatmap"></canvas>

      <!-- Live gaze dot -->
      <div class="gaze-dot hidden" id="gaze-dot"></div>

      <!-- Calibration layer (only the shrinking red dot shows) -->
      <div class="calib" id="calib" hidden>
        <span class="calib-dot" id="calib-dot"></span>
      </div>

      <!-- Validation target (full-screen, like calibration) -->
      <div class="validate" id="validate" hidden>
        <span class="validate-ring" id="validate-ring"></span>
        <span class="validate-dot" id="validate-dot"></span>
      </div>

      <!-- Validation results screen -->
      <div class="results" id="results" hidden>
        <div class="results-frame">
          <h1>Validation</h1>
          <div class="results-rows" id="results-rows"></div>
          <div class="results-summary" id="results-summary"></div>
          <button class="results-done" id="results-done" type="button">Done</button>
        </div>
      </div>

      <!-- Idle splash -->
      <div class="idle-overlay" id="idle-overlay">
        <div class="frame">
          <h1>Gaze · Lite</h1>
          <p>
            Browser-only webcam gaze demo. Start the camera, calibrate against
            nine targets, then print your gaze. Everything runs locally — no
            video leaves your device.
          </p>
        </div>
      </div>

      <!-- Unified toolbar -->
      <div class="toolbar" id="toolbar">
        <div class="tb-buttons">
          <button class="tb-btn primary" id="btn-camera" type="button">
            <span class="ic" id="ic-camera"></span><span class="lb" id="lb-camera">Camera</span>
          </button>
          <button class="tb-btn primary" id="btn-calibrate" type="button" disabled>
            <span class="ic"></span><span class="lb">Calibrate</span>
          </button>
          <button class="tb-btn" id="btn-validate" type="button" disabled>
            <span class="ic"></span><span class="lb">Validate</span>
          </button>
          <button class="tb-btn" id="btn-heatmap" type="button" disabled>
            <span class="ic"></span><span class="lb">Heatmap</span>
          </button>
          <button class="tb-btn icon-only" id="btn-dock" type="button" title="Move toolbar">
            <span class="ic" id="ic-dock"></span>
          </button>
        </div>

        <div class="tb-body">
          <div class="tb-cam">
            <div class="preview">
              <div class="stage mirrored" id="stage">
                <span class="cam-tag">
                  <span class="ledline"></span><span id="cam-tag-text">STANDBY</span>
                </span>
                <video id="video" playsinline muted></video>
                <canvas class="preview-overlay" id="overlay"></canvas>
              </div>
            </div>
          </div>

          <div class="tb-side">
            <div class="tb-readouts">
              <div class="tb-readout" id="ro-left">
                <span class="k">L</span><span class="v" id="val-left">—</span>
              </div>
              <div class="tb-readout" id="ro-right">
                <span class="k">R</span><span class="v" id="val-right">—</span>
              </div>
              <div class="tb-readout">
                <span class="k">FPS</span><span class="v" id="val-fps">—</span>
              </div>
            </div>

            <button class="tb-log" id="log-strip" type="button" aria-expanded="false">
              <span class="tb-log-dot ok" id="log-dot"></span>
              <span class="tb-log-msg" id="log-msg">—</span>
              <span class="tb-log-ts" id="log-ts"></span>
              <span class="tb-log-caret" id="log-caret">▾</span>
            </button>
          </div>
        </div>

        <div class="tb-log-body" id="log-body" hidden>
          <div class="tb-log-head">
            <span class="tb-log-title">Session log</span>
            <button class="tb-log-clear" id="log-clear" type="button">Clear</button>
          </div>
          <div class="tb-log-entries" id="log-entries"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
